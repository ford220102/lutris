name: Build and Release Lutris

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Source Tarball
        run: |
          VERSION="$(python3 -c "import re; print(re.search(r'__version__\\s*=\\s*\\\"([^\\\"]+)\\\"', open('lutris/__init__.py').read()).group(1))")"
          mkdir -p dist
          git archive --format=tar.gz --prefix="lutris-${VERSION}/" -o "dist/lutris-${VERSION}.tar.gz" HEAD
          ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
